<mat-sidenav-container class="sidebar-container">
  <!-- Sidebar Navigation -->
  <mat-sidenav
    class="sidebar"
    [class.sidebar--collapsed]="collapsed()"
    [class.sidebar--expanded]="!collapsed()"
    [opened]="true"
    [mode]="'side'"
    [disableClose]="true"
  >
    <div class="sidebar-content">
      <!-- Header with Toggle -->
      <div class="sidebar-action">
        @if (!collapsed()) {
          <span class="sidebar-brand">
            <app-logo class="sidebar-brand__mark" [size]="26" />
            <span class="sidebar-title">
              <span class="sidebar-title__line">License</span>
              <span class="sidebar-title__line sidebar-title__line--sub">Management</span>
            </span>
          </span>
        }
        <button
          mat-fab
          class="action-button"
          type="button"
          [attr.aria-label]="collapsed() ? 'Expand navigation' : 'Collapse navigation'"
          (click)="toggleSidebar()"
        >
          <mat-icon>menu</mat-icon>
        </button>
      </div>

      <!-- Navigation Items -->
      <nav class="sidebar-nav">
        @for (item of navItems(); track item.route) {
          <div class="nav-item-wrapper">
            <a
              class="nav-item"
              [routerLink]="item.route"
              routerLinkActive="nav-item--active"
              [routerLinkActiveOptions]="{ exact: item.exact }"
              [matTooltip]="item.label"
              [matTooltipDisabled]="!collapsed()"
              matTooltipPosition="right"
              [matTooltipShowDelay]="200"
            >
              <mat-icon class="nav-item__icon">{{ item.icon }}</mat-icon>
              @if (!collapsed()) {
                <span class="nav-item__label">{{ item.label }}</span>
              }
            </a>
          </div>
        }
      </nav>
    </div>
  </mat-sidenav>

  <!-- Main Content Area -->
  <mat-sidenav-content
    class="main-content"
    [class.main-content--sidebar-collapsed]="collapsed()"
    [class.main-content--sidebar-expanded]="!collapsed()"
  >
    <app-page-header />
    <div class="page-content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
