<div class="page-fill">
  <app-data-table
    [data]="applications()"
    [config]="tableConfig"
    [loading]="loading()"
    (action)="handleAction($event)"
  >
  </app-data-table>
</div>

@if (dialog(); as open) {
  @switch (open.kind) {
    @case ('create') {
      <app-application-form (saved)="onSaved($event)" (cancelled)="dialog.set(null)" />
    }
    @case ('edit') {
      <app-application-form
        [application]="open.application"
        (saved)="onSaved($event)"
        (cancelled)="dialog.set(null)"
      />
    }
  }
}
