<div class="login-page">
  <form class="card login-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <header class="login-header">
      <div class="login-mark"><app-logo [size]="56" /></div>
      <h1>License Management</h1>
      <p class="muted">Sign in to manage licenses and users.</p>
    </header>

    @if (error(); as message) {
      <p class="alert alert-error" role="alert">{{ message }}</p>
    }

    <mat-form-field>
      <mat-label>Username</mat-label>
      <input
        matInput
        type="text"
        formControlName="username"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
        autofocus
      />
      <mat-error>Username is required.</mat-error>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Password</mat-label>
      <input matInput type="password" formControlName="password" autocomplete="current-password" />
      <mat-error>Password is required.</mat-error>
    </mat-form-field>

    <button type="submit" matButton="filled" class="login-submit" [disabled]="submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</div>
