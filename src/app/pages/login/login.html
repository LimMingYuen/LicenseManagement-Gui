<div class="login-page">
  <form class="card login-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <header class="login-header">
      <div class="login-mark"><app-logo [size]="56" /></div>
      <h1>License Management</h1>
      <p class="muted">Sign in to manage licenses and users.</p>
    </header>

    @if (error(); as message) {
      <p class="alert alert-error" role="alert">{{ message }}</p>
    }

    <label class="field">
      <span class="field-label">Username</span>
      <input
        type="text"
        formControlName="username"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
        autofocus
      />
      @if (form.controls.username.touched && form.controls.username.invalid) {
        <span class="field-error">Username is required.</span>
      }
    </label>

    <label class="field">
      <span class="field-label">Password</span>
      <input type="password" formControlName="password" autocomplete="current-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="field-error">Password is required.</span>
      }
    </label>

    <button type="submit" class="btn btn-primary btn-block login-submit" [disabled]="submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</div>
