  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- SVG first for browsers that take it; favicon.ico is the fallback. -->
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="logo.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Roboto is the one app typeface (see --font-sans in styles.scss). Weights
       must cover the --fw-* scale (400/500/600/700) or 600 and 700 render as
       faux-bold. 300 is kept for Material's lighter type roles. -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
